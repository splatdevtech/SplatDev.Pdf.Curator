name: Build & Test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x
      - name: build and test
        run: dotnet test SplatDev.DigitalBookCurator.sln --configuration Release
